name: "Spigot API - Notify Version"
description: "Register a Spigot build version with api.yuemi.org and get build number / version ID"
inputs:
  api-key:
    description: "YueMi API Key (VERSION_UPDATE_KEY)"
    required: true
  minecraft-version:
    description: "Minecraft version string (e.g. 1.21.11 or 1.21.11-pre)"
    required: true
  version:
    description: "Spigot version string (e.g. 1.21.11-R0.1-SNAPSHOT)"
    required: true
  git-commit:
    description: "Git commit hash (defaults to current git commit)"
    required: false
    default: ""
  git-branch:
    description: "Git branch name (defaults to current git branch)"
    required: false
    default: ""
  is-latest:
    description: "Whether this version is the latest (true/false)"
    required: false
    default: "true"
  api-url:
    description: "Base URL of the YueMi API"
    required: false
    default: "https://api.yuemi.org"
outputs:
  build-number:
    description: "Assigned build number"
    value: ${{ steps.notify.outputs.build-number }}
  version-id:
    description: "Assigned version ID"
    value: ${{ steps.notify.outputs.version-id }}
  response:
    description: "Full API JSON response"
    value: ${{ steps.notify.outputs.response }}
runs:
  using: "composite"
  steps:
    - name: Notify Spigot Version
      id: notify
      shell: bash
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_MINECRAFT_VERSION: ${{ inputs.minecraft-version }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_GIT_COMMIT: ${{ inputs.git-commit }}
        INPUT_GIT_BRANCH: ${{ inputs.git-branch }}
        INPUT_IS_LATEST: ${{ inputs.is-latest }}
        INPUT_API_URL: ${{ inputs.api-url }}
      run: |
        bash "${{ github.action_path }}/../../shared/scripts/notify_spigot.sh"

